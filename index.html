<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GT650</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- Hidden audio-only YouTube engine -->
  <div id="yt-player" class="yt-hidden"></div>

  <main class="content">
    <div class="now-playing-card">
      <div class="disc" id="disc">
        <div class="disc-hole"></div>
      </div>
      <div class="track-info">
        <h2 id="trackTitle">Loading playlist...</h2>
        <p id="trackIndex">Track 1</p>
      </div>
    </div>
  </main>

  <div class="dock">

    <!-- Floating glass playlist popup — dock ke upar right side -->
    <div class="playlist-panel" id="playlistPanel">
      <ul id="playlistList"></ul>
    </div>

    <div class="dock-glass">

      <button class="dock-btn" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 20L9 12l10-8v16zM7 4v16H5V4h2z" fill="currentColor"/></svg>
      </button>

      <button class="dock-btn play-btn" id="playBtn" aria-label="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
      </button>

      <button class="dock-btn" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 4l10 8-10 8V4zm12 0v16h2V4h-2z" fill="currentColor"/></svg>
      </button>

      <div class="dock-divider"></div>

      <div class="dock-progress-wrap">
        <span id="curTime">0:00</span>
        <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
        <span id="durTime">0:00</span>
      </div>

      <div class="dock-divider"></div>

      <button class="dock-btn vol-btn" id="muteBtn" aria-label="Mute">
        <svg id="volIcon" viewBox="0 0 24 24" width="18" height="18"><path d="M3 10v4h4l5 5V5L7 10H3z" fill="currentColor"/></svg>
      </button>

      <button class="dock-btn" id="playlistToggle" aria-label="Playlist">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>

    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
